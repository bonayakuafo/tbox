name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test ./...

  build:
    name: Build ${{ matrix.goos }} ${{ matrix.goarch }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            extension: ""
          - goos: linux
            goarch: arm64
            extension: ""
          - goos: windows
            goarch: amd64
            extension: .exe
          - goos: darwin
            goarch: amd64
            extension: ""
          - goos: darwin
            goarch: arm64
            extension: ""

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ github.ref_name }}
          EXTENSION: ${{ matrix.extension }}
        run: |
          output="tbox-${GOOS}-${GOARCH}${EXTENSION}"
          mkdir -p dist
          CGO_ENABLED=0 go build \
            -trimpath \
            -ldflags "-s -w -X main.version=${VERSION}" \
            -o "dist/${output}" \
            ./
          sha256sum "dist/${output}" > "dist/${output}.sha256"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tbox-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: tbox-*
          merge-multiple: true

      - name: Display release files
        run: ls -la dist

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            ## Downloads

            Choose the binary that matches your operating system and architecture:

            - `tbox-linux-amd64`
            - `tbox-linux-arm64`
            - `tbox-windows-amd64.exe`
            - `tbox-darwin-amd64`
            - `tbox-darwin-arm64`

            Each binary includes the Git tag as its embedded version. Matching SHA-256 checksum files are included for verification.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
